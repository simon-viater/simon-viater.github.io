255,255,255,0.1); border: 1px solid rgba(255,255,255,0.35); border-radius: 999px; padding: 11px 22px; font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;\">\n      <a href=\"#models\" style=\"color: #FFFFFF; border-bottom: 1px dotted #FFFFFF;\" style-hover=\"color: #FFFFFF;\">Models<\u002Fa>\n      <a href=\"#about\" style=\"color: rgba(255,255,255,0.62);\" style-hover=\"color: #FFFFFF;\">About<\u002Fa>\n      <a href=\"#skills\" style=\"color: rgba(255,255,255,0.62);\" style-hover=\"color: #FFFFFF;\">Skills<\u002Fa>\n      <a href=\"#contact\" style=\"color: rgba(255,255,255,0.62);\" style-hover=\"color: #FFFFFF;\">Contact<\u002Fa>\n    <\u002Fnav>\n    <a href=\"./assets/Simon-Viater-CV.pdf\" download=\"Simon-Viater-CV.pdf\" style=\"background: #FFFFFF; color: #0F3D6B; border-radius: 999px; padding: 11px 20px; font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;\" style-hover=\"background: rgba(255,255,255,0.85); color: #0F3D6B;\">Download CV<\u002Fa>\n  <\u002Fdiv>\n\n  <section id=\"models\" style=\"max-width: 1120px; margin: 0 auto; padding: 0 32px 90px;\">\n    <h1 style=\"font-size: clamp(44px, 7vw, 92px); line-height: 0.92; letter-spacing: -0.03em; font-weight: 700; margin: 74px 0 8px; max-width: 15ch;\">Four models. One spreadsheet habit.<\u002Fh1>\n    <p style=\"margin: 0 0 46px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.06em; color: rgba(255,255,255,0.7);\">Rotterdam · open to roles · self-built case studies<\u002Fp>\n\n    <div style=\"display: grid; grid-template-columns: 44px minmax(0, 1fr) 150px 90px; gap: 18px; align-items: center; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(255,255,255,0.55); padding-bottom: 12px; border-bottom: 2px solid #FFFFFF;\">\n      <span><\u002Fspan><span>Project<\u002Fspan><span>Tool<\u002Fspan><span>Year<\u002Fspan>\n    <\u002Fdiv>\n\n    <div sc-camel-on-mouse-enter=\"{{ hoverRentRoll }}\" sc-camel-on-mouse-leave=\"{{ hoverOut }}\" sc-camel-on-click=\"{{ openRentRoll }}\" style=\"{{ skin1.row }}\">\n      <span style=\"{{ skin1.num }}\">01<\u002Fspan>\n      <h2 style=\"{{ skin1.title }}\">Rent roll analysis<\u002Fh2>\n      <span style=\"{{ skin1.pill }}\">Excel<\u002Fspan>\n      <span style=\"{{ skin1.year }}\">2026<\u002Fspan>\n    <\u002Fdiv>\n\n    <div sc-camel-on-mouse-enter=\"{{ hoverFinancing }}\" sc-camel-on-mouse-leave=\"{{ hoverOut }}\" sc-camel-on-click=\"{{ openFinancing }}\" style=\"{{ skin2.row }}\">\n      <span style=\"{{ skin2.num }}\">02<\u002Fspan>\n      <h2 style=\"{{ skin2.title }}\">Project financing<\u002Fh2>\n      <span style=\"{{ skin2.pill }}\">Excel<\u002Fspan>\n      <span style=\"{{ skin2.year }}\">2026<\u002Fspan>\n    <\u002Fdiv>\n\n    <div sc-camel-on-mouse-enter=\"{{ hoverVariance }}\" sc-camel-on-mouse-leave=\"{{ hoverOut }}\" sc-camel-on-click=\"{{ openVariance }}\" style=\"{{ skin3.row }}\">\n      <span style=\"{{ skin3.num }}\">03<\u002Fspan>\n      <h2 style=\"{{ skin3.title }}\">Actual vs budget spend<\u002Fh2>\n      <span style=\"{{ skin3.pill }}\">Power BI<\u002Fspan>\n      <span style=\"{{ skin3.year }}\">2026<\u002Fspan>\n    <\u002Fdiv>\n\n    <div sc-camel-on-mouse-enter=\"{{ hoverMarket }}\" sc-camel-on-mouse-leave=\"{{ hoverOut }}\" sc-camel-on-click=\"{{ openMarket }}\" style=\"{{ skin4.row }}\">\n      <span style=\"{{ skin4.num }}\">04<\u002Fspan>\n      <h2 style=\"{{ skin4.title }}\">Market analysis<\u002Fh2>\n      <span style=\"{{ skin4.pill }}\">Planned<\u002Fspan>\n      <span style=\"{{ skin4.year }}\">next<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"about\" style=\"border-top: 2px solid rgba(255,255,255,0.35);\">\n    <div style=\"max-width: 1120px; margin: 0 auto; padding: 60px 32px; display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 48px;\">\n      <p style=\"margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(255,255,255,0.6);\">About<\u002Fp>\n      <div>\n        <p style=\"margin: 0; font-size: 25px; line-height: 1.4; font-weight: 500; max-width: 46ch; text-wrap: pretty;\">I like the part of finance where a spreadsheet has to survive contact with reality — leases that break early, capex that slips, invoices that do not match the budget.<\u002Fp>\n        <p style=\"margin: 20px 0 0; font-size: 15px; line-height: 1.7; color: rgba(255,255,255,0.78); max-width: 66ch; text-wrap: pretty;\">MSc Financial Economics at Erasmus University Rotterdam, after a BSc in Economics &amp; Business Administration at Aarhus University and an exchange at HKUST. For a year I was a financial assistant at IMMOCAP, one of Slovakia’s largest real estate developers: reporting on the firm’s debt structure to shareholders, comparing bank term sheets for project financing, maintaining rent rolls for valuation and automating pricing templates. The models here are my own case studies, built to keep those muscles working.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"skills\" style=\"border-top: 2px solid rgba(255,255,255,0.35);\">\n    <div style=\"max-width: 1120px; margin: 0 auto; padding: 60px 32px; display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 48px;\">\n      <p style=\"margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(255,255,255,0.6);\">Skills &amp; tools<\u002Fp>\n      <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 30px 40px;\">\n        <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n          <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(255,255,255,0.55);\">Modelling<\u002Fspan>\n          <span style=\"font-size: 14.5px; line-height: 1.7; color: rgba(255,255,255,0.86);\">Excel financial modelling · lease-level rent rolls · WALT / WALB · cash-flow builds · DSCR debt sizing · IRR / NPV · sensitivity &amp; scenario analysis<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n          <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(255,255,255,0.55);\">Analytics<\u002Fspan>\n          <span style=\"font-size: 14.5px; line-height: 1.7; color: rgba(255,255,255,0.86);\">Power BI · DAX · Power Query · star-schema data models · drill-through reporting · R · HTML dashboards<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n          <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(255,255,255,0.55);\">Domain<\u002Fspan>\n          <span style=\"font-size: 14.5px; line-height: 1.7; color: rgba(255,255,255,0.86);\">Real estate economics · debt structuring and bond reporting · bank term-sheet comparison · valuation support · procurement &amp; market research<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n          <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(255,255,255,0.55);\">Other<\u002Fspan>\n          <span style=\"font-size: 14.5px; line-height: 1.7; color: rgba(255,255,255,0.86);\">English and Slovak · Microsoft Office · Visio · case competitions (top 10, Aarhus Case Competition) · team leadership<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"contact\" style=\"border-top: 2px solid rgba(255,255,255,0.35);\">\n    <div style=\"max-width: 1120px; margin: 0 auto; padding: 60px 32px 80px; display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 48px;\">\n      <p style=\"margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(255,255,255,0.6);\">Contact<\u002Fp>\n      <div>\n        <p style=\"margin: 0 0 26px; font-size: 32px; line-height: 1.2; font-weight: 600; letter-spacing: -0.01em; max-width: 30ch;\">Happy to walk through any of these models line by line.<\u002Fp>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 12px;\">\n          <a href=\"mailto:simon.viater@gmail.com\" style=\"background: #FFFFFF; color: #0F3D6B; border-radius: 999px; padding: 12px 22px; font-family: 'IBM Plex Mono', monospace; font-size: 12px;\" style-hover=\"background: rgba(255,255,255,0.85); color: #0F3D6B;\">simon.viater@gmail.com<\u002Fa>\n          <a href=\"https://simon-viater.github.io/Rotterdam-Science-Tower/\" target=\"_blank\" rel=\"noopener\" style=\"border: 1px solid rgba(255,255,255,0.5); color: #FFFFFF; border-radius: 999px; padding: 12px 22px; font-family: 'IBM Plex Mono', monospace; font-size: 12px;\" style-hover=\"border-color: #FFFFFF; color: #FFFFFF; background: rgba(255,255,255,0.12);\">Rotterdam Science Tower ↗<\u002Fa>\n          <a href=\"./assets/Simon-Viater-CV.pdf\" download=\"Simon-Viater-CV.pdf\" style=\"border: 1px solid rgba(255,255,255,0.5); color: #FFFFFF; border-radius: 999px; padding: 12px 22px; font-family: 'IBM Plex Mono', monospace; font-size: 12px;\" style-hover=\"border-color: #FFFFFF; color: #FFFFFF; background: rgba(255,255,255,0.12);\">Download CV ↓<\u002Fa>\n        <\u002Fdiv>\n        <p style=\"margin: 24px 0 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: rgba(255,255,255,0.6);\">Rotterdam, Netherlands · +421 901 703 384<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <sc-if value=\"{{ previewVisible }}\">\n    <div style=\"position: fixed; left: {{ previewX }}px; top: {{ previewY }}px; width: 330px; background: #FFFFFF; padding: 9px; box-shadow: 0 26px 50px -24px rgba(0,0,0,0.6); transform: rotate(-3deg); pointer-events: none; z-index: 30;\">\n      <sc-if value=\"{{ previewIsImage }}\">\n        <img src=\"dd7870f4-07e2-49b9-b68b-c3131965d021\" alt=\"Rent roll dashboard preview\" style=\"display: block; width: 100%; height: 212px; object-fit: cover; object-position: top;\">\n      <\u002Fsc-if>\n      <sc-if value=\"{{ previewIsLabel }}\">\n        <div style=\"width: 100%; height: 212px; background: #DDE3EA; display: flex; align-items: center; justify-content: center; text-align: center; padding: 20px; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: #7B8590;\">{{ previewLabel }}<\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ panelOpen }}\">\n    <div>\n      <div sc-camel-on-click=\"{{ close }}\" style=\"position: fixed; inset: 0; background: rgba(8,26,46,0.45); z-index: 40; animation: scrimIn 300ms ease-out both;\"><\u002Fdiv>\n      <aside style=\"{{ asideStyle }}\">\n\n        <div style=\"{{ panelHeadStyle }}\">\n          <span style=\"font-size: 11.5px; letter-spacing: 0.17em; text-transform: uppercase; color: #8B9198;\">{{ panelCrumb }}<\u002Fspan>\n          <button type=\"button\" sc-camel-on-click=\"{{ close }}\" style=\"font-family: 'Times New Roman', Times, serif; font-size: 12.5px; letter-spacing: 0.06em; background: transparent; border: 1px solid #C4C7C0; color: #5A6169; padding: 6px 13px; cursor: pointer; transition: all 140ms;\" style-hover=\"border-color: #15181B; color: #15181B;\">Close ×<\u002Fbutton>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ factsSticky }}\">\n          <div style=\"{{ railStyle }}\">\n            <span style=\"font-size: 12.5px; letter-spacing: 0.17em; text-transform: uppercase; color: #8B9198;\">Key figures<\u002Fspan>\n            <sc-for list=\"{{ facts }}\" as=\"f\" hint-placeholder-count=\"5\">\n              <div style=\"padding: 20px 0; border-top: 1px solid #DDDFDA;\">\n                <span style=\"display: block; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #8B9198;\">{{ f.label }}<\u002Fspan>\n                <b style=\"display: block; font-size: 36px; font-weight: 600; letter-spacing: -0.01em; margin-top: 8px; line-height: 1;\">{{ f.value }}<\u002Fb>\n                <span style=\"display: block; font-size: 13.5px; color: #5A6169; margin-top: 8px; line-height: 1.5;\">{{ f.note }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"{{ panelBodyStyle }}\">\n\n          <span style=\"font-size: 11.5px; letter-spacing: 0.17em; text-transform: uppercase; color: #8B9198;\">{{ kicker }}<\u002Fspan>\n          <h1 style=\"font-size: clamp(28px, 3.2vw, 40px); font-weight: 600; line-height: 1.05; letter-spacing: -0.005em; margin: 10px 0 0;\">{{ title }}<\u002Fh1>\n          <p style=\"margin: 10px 0 0; font-size: 13.5px; color: #5A6169;\">{{ standfirst }}<\u002Fp>\n\n          <sc-if value=\"{{ factsBand }}\">\n            <div style=\"display: grid; grid-template-columns: repeat({{ factsCount }}, minmax(0, 1fr)); border-top: 1px solid #15181B; border-bottom: 1px solid #DDDFDA; margin-top: 24px;\">\n              <sc-for list=\"{{ facts }}\" as=\"f\" hint-placeholder-count=\"5\">\n                <div style=\"padding: 18px 16px 20px 0; border-right: 1px solid #DDDFDA;\">\n                  <span style=\"display: block; font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: #8B9198;\">{{ f.label }}<\u002Fspan>\n                  <span style=\"display: block; font-size: 27px; font-weight: 600; margin-top: 8px; line-height: 1;\">{{ f.value }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <div style=\"margin-top: 30px; padding-bottom: 24px; border-bottom: 1px solid #DDDFDA;\">\n            <span style=\"font-size: 11.5px; letter-spacing: 0.17em; text-transform: uppercase; color: #8B9198;\">What it is<\u002Fspan>\n            <h2 style=\"font-size: 19px; font-weight: 600; margin: 8px 0 10px;\">{{ whatHead }}<\u002Fh2>\n            <p style=\"margin: 0; font-size: 15.5px; line-height: 1.6; max-width: 66ch; text-wrap: pretty;\">{{ whatBody }}<\u002Fp>\n          <\u002Fdiv>\n\n          <div style=\"margin-top: 26px; padding-bottom: 24px; border-bottom: 1px solid #DDDFDA;\">\n            <span style=\"font-size: 11.5px; letter-spacing: 0.17em; text-transform: uppercase; color: #8B9198;\">Problem it solves<\u002Fspan>\n            <h2 style=\"font-size: 19px; font-weight: 600; margin: 8px 0 10px;\">{{ problemHead }}<\u002Fh2>\n            <p style=\"margin: 0; font-size: 15.5px; line-height: 1.6; max-width: 66ch; text-wrap: pretty;\">{{ problemBody }}<\u002Fp>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ isRentRoll }}\">\n            <div style=\"margin-top: 30px;\">\n              <span style=\"font-size: 11.5px; letter-spacing: 0.17em; text-transform: uppercase; color: #8B9198;\">Output<\u002Fspan>\n              <h2 style=\"font-size: 19px; font-weight: 600; margin: 8px 0 6px;\">The rent roll, read four ways<\u002Fh2>\n              <p style=\"margin: 0 0 22px; font-size: 13.5px; color: #5A6169; max-width: 64ch;\">Live from the same lease table — hover a floor to trace it into the schedule below.<\u002Fp>\n\n              <div style=\"{{ dashGrid }}\">\n                <div style=\"{{ elevCol }}\">\n                  <span style=\"font-size: 11.5px; letter-spacing: 0.17em; text-transform: uppercase; color: #8B9198;\">Elevation: use and occupancy<\u002Fspan>\n                  <div style=\"margin-top: 16px; display: flex; flex-direction: column; gap: 3px;\">\n                    <sc-for list=\"{{ floors }}\" as=\"f\" hint-placeholder-count=\"22\">\n                      <div sc-camel-on-mouse-enter=\"{{ f.enter }}\" sc-camel-on-mouse-leave=\"{{ litOut }}\" style=\"display: flex; align-items: stretch; gap: 10px; cursor: default;\">\n                        <div style=\"font-size: 11.5px; color: #8B9198; width: 24px; flex: none; display: flex; align-items: center; justify-content: flex-end;\">{{ f.label }}<\u002Fdiv>\n                        <div style=\"display: flex; gap: 3px; flex: 1;\">\n                          <div style=\"{{ f.bar }}\">{{ f.barText }}<\u002Fdiv>\n                        <\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                  <div style=\"border-top: 1.5px solid #15181B; margin: 8px 0 4px 34px;\"><\u002Fdiv>\n                  <div style=\"display: flex; flex-direction: column; gap: 3px; opacity: 0.55;\">\n                    <div style=\"display: flex; align-items: stretch; gap: 10px;\">\n                      <div style=\"font-size: 11.5px; color: #8B9198; width: 24px; flex: none; display: flex; align-items: center; justify-content: flex-end;\">B1<\u002Fdiv>\n                      <div style=\"flex: 1; height: 23px; background: #1F4E8C; color: #FFFFFF; font-size: 11px; display: flex; align-items: center; justify-content: center;\">Parking — 269 let<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"display: flex; align-items: stretch; gap: 10px;\">\n                      <div style=\"font-size: 11.5px; color: #8B9198; width: 24px; flex: none; display: flex; align-items: center; justify-content: flex-end;\">B2<\u002Fdiv>\n                      <div style=\"flex: 1; height: 23px; box-shadow: inset 0 0 0 1px #C4C7C0; color: #5A6169; font-size: 11px; display: flex; align-items: center; justify-content: center; background: repeating-linear-gradient(45deg, transparent, transparent 3px, #DDDFDA 3px, #DDDFDA 4px);\">Parking — 353 vacant<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 18px;\">\n                    <span style=\"font-size: 12px; color: #5A6169; display: flex; align-items: center; gap: 6px;\"><i style=\"width: 12px; height: 12px; flex: none; background: #17685A;\"><\u002Fi>Lab<\u002Fspan>\n                    <span style=\"font-size: 12px; color: #5A6169; display: flex; align-items: center; gap: 6px;\"><i style=\"width: 12px; height: 12px; flex: none; background: #1F4E8C;\"><\u002Fi>Office<\u002Fspan>\n                    <span style=\"font-size: 12px; color: #5A6169; display: flex; align-items: center; gap: 6px;\"><i style=\"width: 12px; height: 12px; flex: none; background: #9C6A0B;\"><\u002Fi>Retail<\u002Fspan>\n                    <span style=\"font-size: 12px; color: #5A6169; display: flex; align-items: center; gap: 6px;\"><i style=\"width: 12px; height: 12px; flex: none; box-shadow: inset 0 0 0 1px #C4C7C0; background: repeating-linear-gradient(45deg, transparent, transparent 3px, #DDDFDA 3px, #DDDFDA 4px);\"><\u002Fi>Vacant<\u002Fspan>\n                    <span style=\"font-size: 12px; color: #5A6169; display: flex; align-items: center; gap: 6px;\"><i style=\"width: 7px; height: 7px; flex: none; background: #A33227; border-radius: 50%;\"><\u002Fi>Break option<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n\n                <div style=\"{{ chartsCol }}\">\n                  <div>\n                    <span style=\"font-size: 11.5px; letter-spacing: 0.17em; text-transform: uppercase; color: #8B9198;\">Covenant<\u002Fspan>\n                    <h3 style=\"font-size: 15.5px; font-weight: 600; margin: 7px 0 0;\">Share of contracted rent by tenant<\u002Fh3>\n                    <div style=\"display: flex; flex-direction: column; gap: 9px; margin-top: 14px;\">\n                      <sc-for list=\"{{ covBars }}\" as=\"b\" hint-placeholder-count=\"7\">\n                        <div style=\"{{ barCov }}\">\n                          <div style=\"{{ barLabelStyle }}\">{{ b.name }}<\u002Fdiv>\n                          <div style=\"{{ trackStyle }}\">\n                            <div style=\"{{ b.fill }}\"><\u002Fdiv>\n                          <\u002Fdiv>\n                          <div style=\"{{ barValStyle }}\">{{ b.val }}<\u002Fdiv>\n                        <\u002Fdiv>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                    <p style=\"margin: 12px 0 0; font-size: 13.5px; color: #5A6169; line-height: 1.55; max-width: 64ch;\">{{ covNote }}<\u002Fp>\n                  <\u002Fdiv>\n\n                  <div>\n                    <span style=\"font-size: 11.5px; letter-spacing: 0.17em; text-transform: uppercase; color: #8B9198;\">Expiry<\u002Fspan>\n                    <h3 style=\"font-size: 15.5px; font-weight: 600; margin: 7px 0 0;\">Contracted rent falling due by year<\u002Fh3>\n                    <div style=\"display: flex; flex-direction: column; gap: 9px; margin-top: 14px;\">\n                      <sc-for list=\"{{ expBars }}\" as=\"b\" hint-placeholder-count=\"6\">\n                        <div style=\"{{ barExp }}\">\n                          <div style=\"{{ barLabelStyle }}\">{{ b.name }}<\u002Fdiv>\n                          <div style=\"{{ trackStyle }}\">\n                            <div style=\"{{ b.fill }}\"><\u002Fdiv>\n                          <\u002Fdiv>\n                          <div style=\"{{ barValStyle }}\">{{ b.val }}<\u002Fdiv>\n                        <\u002Fdiv>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                    <p style=\"margin: 12px 0 0; font-size: 13.5px; color: #5A6169; line-height: 1.55; max-width: 64ch;\">{{ expNote }}<\u002Fp>\n                  <\u002Fdiv>\n\n                  <div>\n                    <span style=\"font-size: 11.5px; letter-spacing: 0.17em; text-transform: uppercase; color: #8B9198;\">Upside<\u002Fspan>\n                    <h3 style=\"font-size: 15.5px; font-weight: 600; margin: 7px 0 0;\">Contracted income against fully let potential<\u002Fh3>\n                    <div style=\"display: flex; flex-direction: column; gap: 9px; margin-top: 14px;\">\n                      <sc-for list=\"{{ revBars }}\" as=\"b\" hint-placeholder-count=\"5\">\n                        <div style=\"{{ barRev }}\">\n                          <div style=\"{{ barLabelStyle }}\">{{ b.name }}<\u002Fdiv>\n                          <div style=\"{{ trackStyle }}\">\n                            <div style=\"{{ b.fill }}\"><\u002Fdiv>\n                          <\u002Fdiv>\n                          <div style=\"{{ barValStyle }}\">{{ b.val }}<\u002Fdiv>\n                        <\u002Fdiv>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                    <p style=\"margin: 12px 0 0; font-size: 13.5px; color: #5A6169; line-height: 1.55; max-width: 64ch;\">{{ revNote }}<\u002Fp>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"margin-top: 34px;\">\n                <span style=\"font-size: 11.5px; letter-spacing: 0.17em; text-transform: uppercase; color: #8B9198;\">Detail<\u002Fspan>\n                <h3 style=\"font-size: 19px; font-weight: 600; margin: 8px 0 0;\">Unit schedule<\u002Fh3>\n                <div style=\"display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 18px 0 0;\">\n                  <button type=\"button\" sc-camel-on-click=\"{{ filterAll }}\" style=\"{{ chipAll }}\">All floors<\u002Fbutton>\n                  <button type=\"button\" sc-camel-on-click=\"{{ filterLet }}\" style=\"{{ chipLet }}\">Let<\u002Fbutton>\n                  <button type=\"button\" sc-camel-on-click=\"{{ filterVacant }}\" style=\"{{ chipVacant }}\">Vacant<\u002Fbutton>\n                  <button type=\"button\" sc-camel-on-click=\"{{ filterLab }}\" style=\"{{ chipLab }}\">Lab<\u002Fbutton>\n                  <button type=\"button\" sc-camel-on-click=\"{{ filterOffice }}\" style=\"{{ chipOffice }}\">Office<\u002Fbutton>\n                  <button type=\"button\" sc-camel-on-click=\"{{ filterRetail }}\" style=\"{{ chipRetail }}\">Retail<\u002Fbutton>\n                  <span style=\"margin-left: auto; font-size: 12.5px; color: #8B9198;\">{{ rowCount }}<\u002Fspan>\n                <\u002Fdiv>\n\n                <div style=\"overflow-x: auto; margin-top: 16px;\">\n                  <sc-raw-table style=\"width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; min-width: 720px;\">\n                    <sc-raw-thead>\n                      <sc-raw-tr>\n                        <sc-raw-th style=\"font-size: 11px; letter-spacing: 0.11em; text-transform: uppercase; color: #8B9198; font-weight: 400; text-align: left; padding: 0 12px 10px 0; border-bottom: 1px solid #15181B; white-space: nowrap;\">Floor<\u002Fsc-raw-th>\n                        <sc-raw-th style=\"font-size: 11px; letter-spacing: 0.11em; text-transform: uppercase; color: #8B9198; font-weight: 400; text-align: left; padding: 0 12px 10px 0; border-bottom: 1px solid #15181B; white-space: nowrap;\">Use<\u002Fsc-raw-th>\n                        <sc-raw-th style=\"font-size: 11px; letter-spacing: 0.11em; text-transform: uppercase; color: #8B9198; font-weight: 400; text-align: left; padding: 0 12px 10px 0; border-bottom: 1px solid #15181B; white-space: nowrap;\">Tenant<\u002Fsc-raw-th>\n                        <sc-raw-th style=\"font-size: 11px; letter-spacing: 0.11em; text-transform: uppercase; color: #8B9198; font-weight: 400; text-align: right; padding: 0 12px 10px 0; border-bottom: 1px solid #15181B; white-space: nowrap;\">NLA m²<\u002Fsc-raw-th>\n                        <sc-raw-th style=\"font-size: 11px; letter-spacing: 0.11em; text-transform: uppercase; color: #8B9198; font-weight: 400; text-align: right; padding: 0 12px 10px 0; border-bottom: 1px solid #15181B; white-space: nowrap;\">€/m²<\u002Fsc-raw-th>\n                        <sc-raw-th style=\"font-size: 11px; letter-spacing: 0.11em; text-transform: uppercase; color: #8B9198; font-weight: 400; text-align: right; padding: 0 12px 10px 0; border-bottom: 1px solid #15181B; white-space: nowrap;\">Contracted rent p.a.<\u002Fsc-raw-th>\n                        <sc-raw-th style=\"font-size: 11px; letter-spacing: 0.11em; text-transform: uppercase; color: #8B9198; font-weight: 400; text-align: right; padding: 0 12px 10px 0; border-bottom: 1px solid #15181B; white-space: nowrap;\">Share<\u002Fsc-raw-th>\n                        <sc-raw-th style=\"font-size: 11px; letter-spacing: 0.11em; text-transform: uppercase; color: #8B9198; font-weight: 400; text-align: right; padding: 0 12px 10px 0; border-bottom: 1px solid #15181B; white-space: nowrap;\">Expiry<\u002Fsc-raw-th>\n                        <sc-raw-th style=\"font-size: 11px; letter-spacing: 0.11em; text-transform: uppercase; color: #8B9198; font-weight: 400; text-align: right; padding: 0 12px 10px 0; border-bottom: 1px solid #15181B; white-space: nowrap;\">Break<\u002Fsc-raw-th>\n                        <sc-raw-th style=\"font-size: 11px; letter-spacing: 0.11em; text-transform: uppercase; color: #8B9198; font-weight: 400; text-align: right; padding: 0 12px 10px 0; border-bottom: 1px solid #15181B; white-space: nowrap;\">Term left<\u002Fsc-raw-th>\n                      <\u002Fsc-raw-tr>\n                    <\u002Fsc-raw-thead>\n                    <sc-raw-tbody>\n                      <sc-for list=\"{{ rows }}\" as=\"r\" hint-placeholder-count=\"12\">\n                        <sc-raw-tr sc-camel-on-mouse-enter=\"{{ r.enter }}\" sc-camel-on-mouse-leave=\"{{ litOut }}\" style=\"{{ r.rowStyle }}\">\n                          <sc-raw-td style=\"padding: 11px 12px 11px 0; border-bottom: 1px solid #DDDFDA; font-size: 13px; color: #5A6169;\">{{ r.label }}<\u002Fsc-raw-td>\n                          <sc-raw-td style=\"padding: 11px 12px 11px 0; border-bottom: 1px solid #DDDFDA; font-size: 14px;\"><span style=\"{{ r.pill }}\">{{ r.use }}<\u002Fspan><\u002Fsc-raw-td>\n                          <sc-raw-td style=\"{{ r.tenantStyle }}\">{{ r.tenant }}<\u002Fsc-raw-td>\n                          <sc-raw-td style=\"padding: 11px 12px 11px 0; border-bottom: 1px solid #DDDFDA; font-size: 13.5px; text-align: right;\">{{ r.nla }}<\u002Fsc-raw-td>\n                          <sc-raw-td style=\"padding: 11px 12px 11px 0; border-bottom: 1px solid #DDDFDA; font-size: 13.5px; text-align: right;\">{{ r.psm }}<\u002Fsc-raw-td>\n                          <sc-raw-td style=\"{{ r.rentStyle }}\">{{ r.rent }}<\u002Fsc-raw-td>\n                          <sc-raw-td style=\"padding: 11px 12px 11px 0; border-bottom: 1px solid #DDDFDA; font-size: 13.5px; text-align: right; color: #5A6169;\">{{ r.share }}<\u002Fsc-raw-td>\n                          <sc-raw-td style=\"padding: 11px 12px 11px 0; border-bottom: 1px solid #DDDFDA; font-size: 13.5px; text-align: right;\">{{ r.expiry }}<\u002Fsc-raw-td>\n                          <sc-raw-td style=\"{{ r.breakStyle }}\">{{ r.brk }}<\u002Fsc-raw-td>\n                          <sc-raw-td style=\"padding: 11px 12px 11px 0; border-bottom: 1px solid #DDDFDA; font-size: 13.5px; text-align: right;\">{{ r.left }}<\u002Fsc-raw-td>\n                        <\u002Fsc-raw-tr>\n                      <\u002Fsc-for>\n                    <\u002Fsc-raw-tbody>\n                    <sc-raw-tfoot>\n                      <sc-raw-tr>\n                        <sc-raw-td colspan=\"3\" style=\"border-top: 1.5px solid #15181B; padding-top: 13px; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #8B9198;\">Total<\u002Fsc-raw-td>\n                        <sc-raw-td style=\"border-top: 1.5px solid #15181B; padding-top: 13px; font-size: 13.5px; font-weight: 500; text-align: right;\">{{ totalNla }}<\u002Fsc-raw-td>\n                        <sc-raw-td style=\"border-top: 1.5px solid #15181B; padding-top: 13px; font-size: 13.5px; font-weight: 500; text-align: right;\">{{ totalPsm }}<\u002Fsc-raw-td>\n                        <sc-raw-td style=\"border-top: 1.5px solid #15181B; padding-top: 13px; font-size: 13.5px; font-weight: 500; text-align: right;\">{{ totalRent }}<\u002Fsc-raw-td>\n                        <sc-raw-td style=\"border-top: 1.5px solid #15181B; padding-top: 13px; font-size: 13.5px; font-weight: 500; text-align: right;\">{{ totalShare }}<\u002Fsc-raw-td>\n                        <sc-raw-td colspan=\"3\" style=\"border-top: 1.5px solid #15181B;\"><\u002Fsc-raw-td>\n                      <\u002Fsc-raw-tr>\n                    <\u002Fsc-raw-tfoot>\n                  <\u002Fsc-raw-table>\n                <\u002Fdiv>\n                <p style=\"margin: 18px 0 0; font-size: 12px; color: #8B9198; line-height: 1.8; border-top: 1px solid #DDDFDA; padding-top: 16px;\">Rents are headline, net of service charge. WALT and WALB are weighted by contracted rent from 14 Aug 2026; WALB assumes every break is exercised. Parking and storage are priced at asking terms.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ hasSlot }}\">\n            <div style=\"margin-top: 30px;\">\n              <span style=\"font-size: 11.5px; letter-spacing: 0.17em; text-transform: uppercase; color: #8B9198;\">Output<\u002Fspan>\n              <h2 style=\"font-size: 19px; font-weight: 600; margin: 8px 0 14px;\">{{ outputHead }}<\u002Fh2>\n              <div style=\"border: 1px dashed #C4C7C0; padding: 10px; background: #FFFFFF;\">\n                <image-slot id=\"{{ slotId }}\" shape=\"rect\" placeholder=\"{{ slotPlaceholder }}\"><\u002Fimage-slot>\n              <\u002Fdiv>\n              <p style=\"margin: 8px 0 0; font-size: 12px; color: #8B9198;\">{{ outputCaption }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <div style=\"margin-top: 30px;\">\n            <span style=\"font-size: 11.5px; letter-spacing: 0.17em; text-transform: uppercase; color: #8B9198;\">{{ findingsLabel }}<\u002Fspan>\n            <h2 style=\"font-size: 19px; font-weight: 600; margin: 8px 0 10px;\">{{ findingsHead }}<\u002Fh2>\n            <div style=\"display: flex; flex-direction: column;\">\n              <sc-for list=\"{{ findings }}\" as=\"f\" hint-placeholder-count=\"4\">\n                <div style=\"padding: 11px 0; border-bottom: 1px solid #DDDFDA; display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; font-size: 15px;\">\n                  <b style=\"color: #1F4E8C; font-weight: 600; font-size: 13px;\">{{ f.n }}<\u002Fb>\n                  <span>{{ f.text }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"margin-top: 30px;\">\n            <span style=\"font-size: 11.5px; letter-spacing: 0.17em; text-transform: uppercase; color: #8B9198;\">Tools<\u002Fspan>\n            <div style=\"display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px;\">\n              <sc-for list=\"{{ tools }}\" as=\"t\" hint-placeholder-count=\"5\">\n                <span style=\"{{ t.style }}\">{{ t.name }}<\u002Fspan>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <sc-if value=\"{{ isRentRoll }}\">\n              <p style=\"margin: 18px 0 0; font-size: 13.5px; color: #5A6169;\">Live version: <a href=\"https://simon-viater.github.io/Rotterdam-Science-Tower/\" target=\"_blank\" rel=\"noopener\">simon-viater.github.io/Rotterdam-Science-Tower<\u002Fa><\u002Fp>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ isMarket }}\">\n              <p style=\"margin: 18px 0 0; font-size: 13.5px; color: #5A6169;\">Want to see it when it is done? <a href=\"mailto:simon.viater@gmail.com\">simon.viater@gmail.com<\u002Fa><\u002Fp>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Faside>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <footer style=\"border-top: 2px solid rgba(255,255,255,0.35);\">\n    <div style=\"max-width: 1120px; margin: 0 auto; padding: 22px 32px; display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: rgba(255,255,255,0.55);\">\n      <span>Šimon Viater · financial modelling portfolio<\u002Fspan>\n      <span>All figures come from self-built case studies, not client data.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;factsLayout&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Sticky side rail&quot;,&quot;Band across the top&quot;],&quot;default&quot;:&quot;Sticky side rail&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Detail panel&quot;,&quot;label&quot;:&quot;Key figures&quot;},&quot;panelWidth&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:980,&quot;min&quot;:700,&quot;max&quot;:1200,&quot;step&quot;:20,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Detail panel&quot;,&quot;label&quot;:&quot;Panel width&quot;}}\">\nconst ASOF = Date.UTC(2026, 7, 14);\nconst ASK = { Office: 195, Lab: 250, Retail: 300 };\nconst PARK = { let: 269, vacant: 353, rate: 950 };\nconst STORE = { vacant: 21, rate: 1000 };\nconst RAW = [\n  [21, 'Lab', 'Lab Tenant A', 1485, '2029-04-30', 250, 371250, null],\n  [20, 'Lab', 'Cerba Research', 1485, '2031-05-31', 230, 341550, null],\n  [19, 'Lab', 'Cerba Research', 1485, '2031-05-31', 230, 341550, null],\n  [18, 'Lab', 'LabHotel / Erasmus MC Incubator', 1485, '2027-12-31', 250, 371250, null],\n  [17, 'Lab', 'Cerba Research (Viroclinics-DDL)', 1485, '2032-07-31', 240, 356400, '2027-07-31'],\n  [16, 'Lab', 'Cerba Research (Viroclinics-DDL)', 1485, '2032-07-31', 240, 356400, '2027-07-31'],\n  [15, 'Office', null, 1485, null, 195, 0, null],\n  [14, 'Office', 'Tenant F', 1485, '2029-02-28', 175, 259875, null],\n  [13, 'Office', 'Henkel', 1485, '2030-10-31', 180, 267300, null],\n  [12, 'Office', 'Hardt Hyperloop', 1485, '2027-06-30', 175, 259875, null],\n  [11, 'Office', 'Erasmus Centre for Entrepreneurship', 1485, '2030-08-31', 150, 222750, null],\n  [10, 'Office', 'Esset', 1485, '2029-06-30', 180, 267300, null],\n  [9, 'Office', 'KPMG', 1485, '2029-12-31', 185, 274725, null],\n  [8, 'Office', 'Tenant B', 1485, '2028-03-31', 170, 252450, null],\n  [7, 'Office', 'Tenant A', 1485, '2026-09-30', 160, 237600, null],\n  [6, 'Office', null, 1485, null, 195, 0, null],\n  [5, 'Office', null, 1485, null, 195, 0, null],\n  [4, 'Office', null, 1485, null, 195, 0, null],\n  [3, 'Office', null, 1485, null, 195, 0, null],\n  [2, 'Office', null, 1485, null, 195, 0, null],\n  [1, 'Office', null, 1485, null, 195, 0, null],\n  [0, 'Retail', 'Coffee bar / restaurant', 800, '2029-07-31', 300, 240000, null]\n];\nconst USE_COLOR = { Office: '#1F4E8C', Lab: '#17685A', Retail: '#9C6A0B' };\nconst PILL_BG = { Office: '#E7EDF6', Lab: '#E2EFEB', Retail: '#F6EEDC' };\nconst VAC_HATCH = 'repeating-linear-gradient(45deg,transparent,transparent 3px,#DDDFDA 3px,#DDDFDA 4px)';\nconst GREENISH = /power bi|dax|star|drill|mapping|market data|html/i;\n\nclass Component extends DCLogic {\n  state = { open: null, hover: null, x: 0, y: 0, filter: 'all', lit: null, vw: 1400 };\n\n  componentDidMount() {\n    this._fit = () => this.setState({ vw: window.innerWidth || 1400 });\n    window.addEventListener('resize', this._fit);\n    this._fit();\n    this._onKey = (e) => { if (e.key === 'Escape') this.setState({ open: null }); };\n    this._onMove = (e) => {\n      if (!this.state.hover) return;\n      this.setState({ x: e.clientX - 165, y: e.clientY - 110 });\n    };\n    window.addEventListener('keydown', this._onKey);\n    window.addEventListener('mousemove', this._onMove);\n  }\n  componentWillUnmount() {\n    window.removeEventListener('resize', this._fit);\n    window.removeEventListener('keydown', this._onKey);\n    window.removeEventListener('mousemove', this._onMove);\n  }\n\n  open(key) { return () => this.setState({ open: key, hover: null, filter: 'all', lit: null }); }\n  hover(key, label) { return (e) => this.setState({ hover: key, hoverLabel: label, x: e.clientX - 165, y: e.clientY - 110 }); }\n\n  eur(n) { return '\\u20ac' + Math.round(n).toLocaleString('en-GB'); }\n  eurM(n) { return '\\u20ac' + (n / 1e6).toFixed(2) + 'm'; }\n  fmtD(s) { return new Date(s + 'T00:00:00Z').toLocaleDateString('en-GB', { month: 'short', year: 'numeric', timeZone: 'UTC' }); }\n  yrs(s) { return (new Date(s + 'T00:00:00Z').getTime() - ASOF) / 315360e5; }\n\n  model() {\n    const V = RAW.map((r) => {\n      const isLet = !!r[2];\n      return {\n        ord: r[0], label: r[0] === 0 ? 'GF' : String(r[0]).padStart(2, '0'),\n        use: r[1], tenant: r[2], nla: r[3], end: r[4], psm: r[5], rent: r[6], brk: r[7],\n        let: isLet, erv: isLet ? 0 : r[3] * ASK[r[1]],\n        left: r[4] ? Math.max(0, this.yrs(r[4])) : 0,\n        covenant: isLet ? r[2].replace(/^Cerba Research.*$/, 'Cerba Research') : null\n      };\n    });\n    const letV = V.filter((u) => u.let);\n    const totNLA = V.reduce((s, u) => s + u.nla, 0);\n    const letNLA = letV.reduce((s, u) => s + u.nla, 0);\n    const rent = letV.reduce((s, u) => s + u.rent, 0);\n    const vacERV = V.filter((u) => !u.let).reduce((s, u) => s + u.erv, 0);\n    const anc = PARK.let * PARK.rate;\n    return {\n      V, letV, totNLA, letNLA, vacNLA: totNLA - letNLA, rent, anc, vacERV,\n      parkERV: PARK.vacant * PARK.rate, storeERV: STORE.vacant * STORE.rate,\n      reversion: vacERV + PARK.vacant * PARK.rate + STORE.vacant * STORE.rate,\n      walt: letV.reduce((s, u) => s + u.rent * u.left, 0) / rent,\n      walb: letV.reduce((s, u) => s + u.rent * Math.max(0, this.yrs(u.brk || u.end)), 0) / rent,\n      avgPsm: rent / letNLA,\n      brkRent: letV.filter((u) => u.brk).reduce((s, u) => s + u.rent, 0)\n    };\n  }\n\n  matches(u) {\n    const f = this.state.filter;\n    return f === 'all' || (f === 'let' && u.let) || (f === 'vacant' && !u.let) || u.use === f;\n  }\n  fill(pct, color) {\n    return { height: '18px', width: Math.max(1, pct) + '%', background: color, transition: 'width 700ms cubic-bezier(0.2,0.7,0.3,1)' };\n  }\n  chipStyle(active) {\n    return {\n      fontFamily: \"'Times New Roman', Times, serif\", fontSize: '12.5px', letterSpacing: '0.02em',\n      padding: '6px 13px', cursor: 'pointer', transition: 'all 140ms',\n      background: active ? '#15181B' : 'transparent',\n      border: '1px solid ' + (active ? '#15181B' : '#C4C7C0'),\n      color: active ? '#F4F5F2' : '#5A6169'\n    };\n  }\n  cell(extra) {\n    return Object.assign({ padding: '11px 12px 11px 0', borderBottom: '1px solid #DDDFDA', fontSize: '13.5px', textAlign: 'right' }, extra || {});\n  }\n  setFilter(f) { return () => this.setState({ filter: f }); }\n\n  rowSkin(key, opts) {\n    const on = this.state.hover === key && !this.state.open;\n    const dim = !!(opts && opts.dim);\n    const dash = !!(opts && opts.dash);\n    return {\n      row: {\n        display: 'grid', gridTemplateColumns: '44px minmax(0, 1fr) 150px 90px', gap: '18px',\n        alignItems: 'center', cursor: 'pointer', minHeight: '92px',\n        padding: on ? '24px 22px 24px 24px' : '24px 0',\n        margin: on ? '0 -22px' : '0',\n        background: on ? '#FFFFFF' : 'transparent',\n        borderBottom: on ? '2px solid transparent' : (dash ? '2px dashed rgba(255,255,255,0.75)' : '2px solid #FFFFFF'),\n        opacity: dim && !on ? 0.6 : 1,\n        transition: 'background 180ms ease, padding 260ms cubic-bezier(0.22,1,0.36,1), margin 260ms cubic-bezier(0.22,1,0.36,1), opacity 200ms'\n      },\n      num: {\n        fontFamily: \"'IBM Plex Mono', monospace\", fontSize: '11.5px',\n        color: on ? 'rgba(15,61,107,0.55)' : 'rgba(255,255,255,0.6)', transition: 'color 180ms'\n      },\n      title: {\n        margin: 0, fontSize: 'clamp(26px, 3.6vw, 42px)', fontWeight: 600, lineHeight: 1,\n        color: on ? '#0F3D6B' : (dim ? 'rgba(255,255,255,0.62)' : 'rgba(255,255,255,0.72)'),\n        transition: 'color 180ms'\n      },\n      pill: {\n        justifySelf: 'start', fontFamily: \"'IBM Plex Mono', monospace\", fontSize: '10.5px',\n        borderRadius: '999px', padding: '6px 12px',\n        border: '1px ' + (dash ? 'dashed ' : 'solid ') + (on ? 'rgba(15,61,107,0.4)' : 'rgba(255,255,255,0.5)'),\n        color: on ? '#0F3D6B' : 'rgba(255,255,255,0.85)', transition: 'color 180ms, border-color 180ms'\n      },\n      year: {\n        fontFamily: \"'IBM Plex Mono', monospace\", fontSize: '11.5px',\n        color: on ? 'rgba(15,61,107,0.55)' : 'rgba(255,255,255,0.6)', transition: 'color 180ms'\n      }\n    };\n  }\n\n  copy() {\n    const open = this.state.open;\n    if (open === 'rentroll') return {\n      kicker: 'Excel \\u00b7 Real estate \\u00b7 Rotterdam',\n      title: 'Rent roll analysis of a partly-let science tower',\n      standfirst: 'A reconstructed case study on a real building: GF + 21 floors, 31,985 m\\u00b2 NLA, 622 parking spaces, as at 14 Aug 2026.',\n      whatHead: 'One lease table, built from scratch, that drives every figure on the page',\n      whatBody: 'I rebuilt the rent roll of a Rotterdam science tower lease by lease \\u2014 unit, floor, use, lettable area, passing rent, contract dates and break options \\u2014 and derived everything from those rows: occupancy, average passing rent, WALT, WALB, covenant concentration, expiry profile and the fully-let bridge. No headline number is typed in, so changing one lease moves the whole analysis.',\n      problemHead: 'Where does the income sit, what breaks first, and what are the empty floors worth?',\n      problemBody: 'An owner holding a tower two-thirds let cannot answer those three questions from a valuation summary. The rent roll can answer all three at once, but only if it is read as a structure rather than a list \\u2014 by covenant, by expiry year, and against asking terms for the space standing empty.',\n      findingsLabel: 'Findings', findingsHead: 'What the roll actually says',\n      findings: [\n        'One tenant carries 32% of contracted rent across four floors \\u2014 the largest single covenant risk in the building.',\n        '20% of contracted rent expires by the end of 2027; 2029 alone is 32%.',\n        'A break option in July 2027 puts \\u20ac712,800 at risk earlier than the WALT implies.',\n        'Letting the vacancy at asking terms adds \\u20ac2.38m a year \\u2014 51% on top of current contracted income.'\n      ],\n      tools: ['Excel', 'Power Query', 'Lease-level rent roll', 'WALT / WALB', 'Covenant analysis', 'HTML dashboard'],\n      hasSlot: false\n    };\n    if (open === 'financing') return {\n      kicker: 'Excel \\u00b7 Project finance \\u00b7 Offshore wind',\n      title: 'Financing an offshore wind farm, construction to exit',\n      standfirst: 'A case study financing model: capex drawdown, sculpted senior debt, waterfall to equity, IRR and profit.',\n      whatHead: 'A full project finance model driven off one assumption sheet',\n      whatBody: 'Installed capacity, capex profile and construction schedule, capacity factor, power price, opex, availability, tax and depreciation all live on a single driver sheet. Below it the model builds construction drawdown with capitalised interest, operating cash flow, senior debt sized back from a minimum DSCR with sculpted amortisation, and a waterfall down to equity distributions \\u2014 giving project IRR, equity IRR, NPV, payback and cumulative profit off the same rows.',\n      problemHead: 'Can the project carry its debt, and does equity still get paid?',\n      problemBody: 'Offshore wind is capital up front and cash flow much later, so leverage cannot be assumed. The model has to solve how much senior debt the project can service through construction and early operations, then show whether what is left over clears an equity hurdle \\u2014 under a downside case as well as the base one.',\n      findingsLabel: 'What the model shows', findingsHead: 'Where the deal is actually decided',\n      findings: [\n        'Project IRR, equity IRR, NPV and payback all move off one live set of assumptions.',\n        'The DSCR floor, not lender appetite, sets maximum leverage \\u2014 and drags the equity return with it.',\n        'Capacity factor and power price dominate the return; capex overrun mostly delays it.'\n      ],\n      tools: ['Excel', 'DSCR debt sizing', 'Cash flow waterfall', 'IRR / NPV', 'Scenario & sensitivity'],\n      hasSlot: true, slotId: 'financing-shot',\n      slotPlaceholder: 'Drop a screenshot of the financing model \\u2014 returns summary, waterfall or sensitivity tables',\n      outputHead: 'The model', outputCaption: 'Fig. 1 \\u2014 returns summary and sensitivity grid.',\n      facts: [\n        { label: 'Asset', value: 'Offshore wind', note: 'North Sea case study' },\n        { label: 'Debt sizing', value: 'DSCR', note: 'sculpted amortisation, solved from cash flow' },\n        { label: 'Returns', value: 'IRR / NPV', note: 'project and equity, plus payback' },\n        { label: 'Cases', value: 'Base + downside', note: 'delayed commissioning, capex overrun' }\n      ]\n    };\n    if (open === 'variance') return {\n      kicker: 'Power BI \\u00b7 Cost control \\u00b7 Construction',\n      title: 'Actual vs budget across six construction projects',\n      standfirst: 'A case study built on roughly 1,000 supplier invoices \\u2014 modelled, measured and reported entirely in Power BI.',\n      whatHead: 'An invoice ledger turned into a report that answers questions in three clicks',\n      whatBody: 'I cleaned about 1,000 invoices in Power Query \\u2014 vendors normalised, cost categories mapped, dates typed, credit notes handled \\u2014 then modelled them as a star schema with projects, categories, vendors and a proper date table around the invoice fact table. DAX measures carry actuals, budget, variance and variance %, period-to-date and cumulative burn, and the report is laid out as a drill path from portfolio to project to category to the invoice line itself.',\n      problemHead: 'Which project is running hot, in which category, and which invoices caused it?',\n      problemBody: 'Invoices arrive continuously across six sites and a monthly spreadsheet is always a month behind. A controller needs the portfolio position, the project behind it and the invoices behind that \\u2014 without asking six site teams to send a summary.',\n      findingsLabel: 'What the report gives a controller', findingsHead: 'From portfolio down to invoice line',\n      findings: [\n        'Portfolio variance at a glance, then per project \\u2014 over or under, in euros and in percent.',\n        'Monthly burn against budget, so a slipping schedule shows up as a spend shape rather than a surprise.',\n        'The cost categories and vendors driving each overrun, with drill-through to the invoice behind any figure.'\n      ],\n      tools: ['Power BI', 'Power Query', 'DAX', 'Star schema', 'Drill-through'],\n      hasSlot: true, slotId: 'variance-shot',\n      slotPlaceholder: 'Drop a screenshot of the Power BI actual vs budget report',\n      outputHead: 'The report', outputCaption: 'Fig. 1 \\u2014 portfolio variance, monthly burn and category breakdown.',\n      facts: [\n        { label: 'Projects', value: '6', note: 'construction sites in one model' },\n        { label: 'Invoices', value: '~1,000', note: 'cleaned and categorised in Power Query' },\n        { label: 'Model', value: 'Star schema', note: 'invoice fact table, four dimensions' },\n        { label: 'Drill path', value: '4 levels', note: 'portfolio to project to category to invoice' }\n      ]\n    };\n    return {\n      kicker: 'Power BI \\u00b7 In progress',\n      title: 'Market analysis',\n      standfirst: 'Not built yet. This is the brief I am working to.',\n      whatHead: 'The submarket context around a modelled asset',\n      whatBody: 'Rents, vacancy and take-up by submarket and asset class, mapped and trended in Power BI, with one view that places a modelled building against its comparables.',\n      problemHead: 'A passing rent means nothing without the market around it',\n      problemBody: 'The rent roll answers questions about one building. \\u20ac205/m\\u00b2 is only good or bad relative to what the market is doing \\u2014 so the next model benchmarks it rather than comparing it to an asking price.',\n      findingsLabel: 'Planned build', findingsHead: 'Three views to build',\n      findings: [\n        'Rent and vacancy benchmarks by submarket and asset class, on a map.',\n        'Take-up and supply pipeline trends over time.',\n        'One view placing the modelled asset against its comparables.'\n      ],\n      tools: ['Power BI', 'DAX', 'Market data', 'Mapping'],\n      hasSlot: false,\n      facts: [\n        { label: 'Status', value: 'Planned', note: 'next model in the series' },\n        { label: 'Tool', value: 'Power BI', note: 'maps and trend views' },\n        { label: 'Scope', value: 'Submarkets', note: 'rents, vacancy, take-up' }\n      ]\n    };\n  }\n\n  renderVals() {\n    const st = this.state;\n    const open = st.open;\n    const hover = st.hover;\n    const showPreview = false;\n    const sticky = (this.props.factsLayout ?? 'Sticky side rail') === 'Sticky side rail' && (st.vw || 1400) >= 820;\n    const width = this.props.panelWidth ?? 980;\n    const c = this.copy();\n    const isRentRoll = open === 'rentroll';\n\n    const out = {\n      panelOpen: !!open,\n      panelCrumb: {\n        rentroll: 'Models / 01 \\u2014 Rent roll analysis',\n        financing: 'Models / 02 \\u2014 Project financing',\n        variance: 'Models / 03 \\u2014 Actual vs budget spend',\n        market: 'Models / 04 \\u2014 Market analysis'\n      }[open] || '',\n      isRentRoll, isMarket: open === 'market',\n      openRentRoll: this.open('rentroll'),\n      openFinancing: this.open('financing'),\n      openVariance: this.open('variance'),\n      openMarket: this.open('market'),\n      close: () => this.setState({ open: null }),\n      hoverRentRoll: this.hover('rentroll'),\n      hoverFinancing: this.hover('financing', 'Financing model \\u2014 screenshot to come'),\n      hoverVariance: this.hover('variance', 'Power BI report \\u2014 screenshot to come'),\n      hoverMarket: this.hover('market', 'Market analysis \\u2014 planned'),\n      hoverOut: () => this.setState({ hover: null }),\n      previewVisible: showPreview,\n      previewIsImage: showPreview && hover === 'rentroll',\n      previewIsLabel: showPreview && hover !== 'rentroll',\n      previewLabel: st.hoverLabel || '',\n      previewX: st.x, previewY: st.y,\n      litOut: () => this.setState({ lit: null }),\n      skin1: this.rowSkin('rentroll'),\n      skin2: this.rowSkin('financing'),\n      skin3: this.rowSkin('variance'),\n      skin4: this.rowSkin('market', { dim: true, dash: true }),\n      kicker: c.kicker, title: c.title, standfirst: c.standfirst,\n      whatHead: c.whatHead, whatBody: c.whatBody,\n      problemHead: c.problemHead, problemBody: c.problemBody,\n      findingsLabel: c.findingsLabel, findingsHead: c.findingsHead,\n      findings: c.findings.map((t, i) => ({ n: String(i + 1).padStart(2, '0'), text: t })),\n      tools: c.tools.map((name) => ({\n        name,\n        style: {\n          fontSize: '12.5px', padding: '3px 10px',\n          background: GREENISH.test(name) ? '#E2EFEB' : '#E7EDF6',\n          color: GREENISH.test(name) ? '#17685A' : '#1F4E8C'\n        }\n      })),\n      hasSlot: !!c.hasSlot, slotId: c.slotId || 'slot', slotPlaceholder: c.slotPlaceholder || '',\n      outputHead: c.outputHead || '', outputCaption: c.outputCaption || '',\n      factsSticky: sticky, factsBand: !sticky,\n      asideStyle: {\n        position: 'fixed', top: 0, right: 0, bottom: 0, width: 'min(' + width + 'px, 97vw)',\n        background: '#F4F5F2', color: '#15181B', fontFamily: \"'Times New Roman', Times, serif\",\n        fontSize: '16.5px', lineHeight: 1.55, fontVariantNumeric: 'tabular-nums',\n        overflowY: 'auto', boxShadow: '-30px 0 80px -32px rgba(0,0,0,0.5)', zIndex: 41,\n        animation: 'panelIn 440ms cubic-bezier(0.22,1,0.36,1) both',\n        display: sticky ? 'grid' : 'block',\n        gridTemplateColumns: sticky ? '306px minmax(0, 1fr)' : undefined,\n        alignItems: sticky ? 'start' : undefined\n      },\n      panelHeadStyle: {\n        position: 'sticky', top: 0, zIndex: 3, background: '#F4F5F2',\n        borderBottom: '1px solid #15181B', padding: '16px 34px',\n        display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: '20px',\n        gridColumn: sticky ? '1 / -1' : undefined\n      },\n      railStyle: {\n        position: 'sticky', top: '58px', padding: '28px 26px 40px',\n        borderRight: '1px solid #DDDFDA', alignSelf: 'start'\n      },\n      panelBodyStyle: {\n        padding: sticky ? '26px 34px 80px 28px' : '26px 34px 80px',\n        minWidth: 0, animation: 'fadeUp 380ms ease-out both'\n      },\n      facts: c.facts || [],\n      factsCount: (c.facts || []).length || 4,\n      floors: [], covBars: [], expBars: [], revBars: [], rows: [],\n      covNote: '', expNote: '', revNote: '', rowCount: '',\n      totalNla: '', totalPsm: '', totalRent: '', totalShare: '',\n      chipAll: this.chipStyle(st.filter === 'all'),\n      chipLet: this.chipStyle(st.filter === 'let'),\n      chipVacant: this.chipStyle(st.filter === 'vacant'),\n      chipLab: this.chipStyle(st.filter === 'Lab'),\n      chipOffice: this.chipStyle(st.filter === 'Office'),\n      chipRetail: this.chipStyle(st.filter === 'Retail'),\n      filterAll: this.setFilter('all'), filterLet: this.setFilter('let'),\n      filterVacant: this.setFilter('vacant'), filterLab: this.setFilter('Lab'),\n      filterOffice: this.setFilter('Office'), filterRetail: this.setFilter('Retail')\n    };\n\n    const panelW = Math.min(width, (st.vw || 1400) * 0.97);\n    const bodyW = panelW - (sticky ? 306 : 0) - (sticky ? 62 : 68);\n    const oneCol = bodyW < 660;\n    const chartW = oneCol ? bodyW : Math.max(200, bodyW * 0.6 - 28);\n    const tight = chartW < 420;\n    const labelW = tight ? 96 : 172;\n    const valW = tight ? 84 : 118;\n    const barRow = (lw, vw2) => ({\n      display: 'grid',\n      gridTemplateColumns: 'minmax(0, ' + lw + 'px) minmax(0, 1fr) minmax(0, ' + vw2 + 'px)',\n      alignItems: 'center', gap: tight ? '8px' : '12px'\n    });\n    out.dashGrid = {\n      display: 'grid',\n      gridTemplateColumns: oneCol ? 'minmax(0, 1fr)' : 'minmax(0, 0.8fr) minmax(0, 1.2fr)',\n      borderTop: '1px solid #15181B'\n    };\n    out.elevCol = oneCol\n      ? { padding: '24px 0 28px', borderBottom: '1px solid #DDDFDA', minWidth: 0 }\n      : { padding: '24px 28px 28px 0', borderRight: '1px solid #DDDFDA', minWidth: 0 };\n    out.chartsCol = {\n      padding: oneCol ? '24px 0 28px' : '24px 0 28px 28px',\n      display: 'flex', flexDirection: 'column', gap: '28px', minWidth: 0\n    };\n    out.barCov = barRow(labelW, valW);\n    out.barExp = barRow(tight ? 44 : 56, valW);\n    out.barRev = barRow(tight ? 92 : 150, tight ? 78 : 108);\n    out.trackStyle = { height: '18px', background: '#FFFFFF', boxShadow: 'inset 0 0 0 1px #DDDFDA', display: 'flex', minWidth: 0 };\n    out.barLabelStyle = { fontSize: tight ? '11.5px' : '12.5px', color: '#5A6169', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis', minWidth: 0 };\n    out.barValStyle = { fontSize: tight ? '11.5px' : '12.5px', textAlign: 'right', color: '#5A6169', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis', minWidth: 0 };\n\n    if (!isRentRoll) return out;\n\n    const m = this.model();\n    out.facts = [\n      { label: 'Contracted rent', value: this.eurM(m.rent + m.anc), note: this.eur(m.rent) + ' rent, ' + this.eur(m.anc) + ' parking' },\n      { label: 'Avg passing rent', value: '\\u20ac' + m.avgPsm.toFixed(0), note: 'per m\\u00b2/yr on let space, against a \\u20ac195\\u2013250 ask' },\n      { label: 'Occupancy by NLA', value: (m.letNLA / m.totNLA * 100).toFixed(1) + '%', note: m.letNLA.toLocaleString('en-GB') + ' of ' + m.totNLA.toLocaleString('en-GB') + ' m\\u00b2 let' },\n      { label: 'WALT to expiry', value: m.walt.toFixed(2) + 'y', note: 'WALB ' + m.walb.toFixed(2) + 'y \\u00b7 ' + this.eur(m.brkRent) + ' breakable Jul 2027' },\n      { label: 'Upside if fully let', value: this.eurM(m.reversion), note: m.vacNLA.toLocaleString('en-GB') + ' m\\u00b2 and ' + PARK.vacant + ' spaces at asking terms' }\n    ];\n    out.factsCount = 5;\n\n    out.floors = m.V.map((u) => ({\n      label: u.label,\n      barText: u.let ? u.use : 'vacant',\n      enter: () => this.setState({ lit: u.ord }),\n      bar: Object.assign({\n        flex: u.nla, height: '23px', fontSize: '11px', letterSpacing: '0.03em',\n        display: 'flex', alignItems: 'center', justifyContent: 'center',\n        position: 'relative', transition: 'transform 150ms, filter 150ms, opacity 200ms',\n        transform: st.lit === u.ord ? 'translateX(3px)' : 'none',\n        outline: st.lit === u.ord ? '2px solid #15181B' : 'none', outlineOffset: '2px',\n        opacity: this.matches(u) ? 1 : 0.18,\n        boxShadow: u.brk ? 'inset -7px 0 0 -3px #A33227' : (u.let ? 'none' : 'inset 0 0 0 1px #C4C7C0')\n      }, u.let\n        ? { background: USE_COLOR[u.use], color: '#FFFFFF' }\n        : { background: VAC_HATCH, color: '#5A6169' })\n    }));\n\n    const byCov = {};\n    m.letV.forEach((u) => { byCov[u.covenant] = (byCov[u.covenant] || 0) + u.rent; });\n    let covs = Object.keys(byCov).map((k) => [k, byCov[k]]).sort((a, b) => b[1] - a[1]);\n    if (covs.length > 7) {\n      const tail = covs.slice(6);\n      covs = covs.slice(0, 6).concat([[tail.length + ' other tenants', tail.reduce((s, c) => s + c[1], 0), true]]);\n    }\n    const peakC = covs[0][1];\n    out.covBars = covs.map((c2) => {\n      const share = c2[1] / m.rent;\n      const hot = share >= 0.25 && !c2[2];\n      return {\n        name: c2[0], val: this.eur(c2[1]) + ' \\u00b7 ' + (share * 100).toFixed(0) + '%',\n        fill: this.fill(c2[1] / peakC * 100, hot ? '#6E97D0' : '#1F4E8C')\n      };\n    });\n    out.covNote = covs[0][0] + ' carries ' + (covs[0][1] / m.rent * 100).toFixed(0) + '% of contracted rent across '\n      + m.letV.filter((u) => u.covenant === covs[0][0]).length\n      + ' floors. The lighter bar marks any single covenant holding more than 25% of income.';\n\n    const byYear = {};\n    m.letV.forEach((u) => { const y = u.end.slice(0, 4); byYear[y] = (byYear[y] || 0) + u.rent; });\n    const years = Object.keys(byYear).sort();\n    const peakY = Math.max.apply(null, years.map((y) => byYear[y]));\n    out.expBars = years.map((y) => ({\n      name: y,\n      val: this.eur(byYear[y]) + ' \\u00b7 ' + (byYear[y] / m.rent * 100).toFixed(0) + '%',\n      fill: this.fill(byYear[y] / peakY * 100, byYear[y] === peakY ? '#6E97D0' : '#1F4E8C')\n    }));\n    const near = years.filter((y) => Number(y) <= 2027).reduce((s, y) => s + byYear[y], 0);\n    const peakYr = years.filter((y) => byYear[y] === peakY)[0];\n    out.expNote = (near / m.rent * 100).toFixed(0) + '% of contracted rent expires by the end of 2027. The largest single cluster is '\n      + peakYr + ' at ' + (peakY / m.rent * 100).toFixed(0) + '%, shown in the lighter blue. The Cerba break in Jul 2027 is not counted here.';\n\n    const SHADES = ['#14375F', '#2E61A9', '#5682BF', '#7FA3D4', '#A8C3E8'];\n    const revRows = [\n      ['Contracted now', m.rent + m.anc],\n      ['Vacant floors at ask', m.vacERV],\n      ['Vacant parking at ask', m.parkERV],\n      ['Vacant storage at ask', m.storeERV],\n      ['Fully let potential', m.rent + m.anc + m.reversion]\n    ];\n    const peakR = Math.max.apply(null, revRows.map((r) => r[1]));\n    out.revBars = revRows.map((r, i) => ({\n      name: r[0], val: this.eur(r[1]), fill: this.fill(r[1] / peakR * 100, SHADES[i])\n    }));\n    out.revNote = m.vacNLA.toLocaleString('en-GB') + ' m\\u00b2 and ' + PARK.vacant\n      + ' parking spaces sit empty. Let at asking terms they would add ' + this.eurM(m.reversion) + ' a year, '\n      + (m.reversion / (m.rent + m.anc) * 100).toFixed(0) + '% on top of current contracted income.';\n\n    const list = m.V.filter((u) => this.matches(u));\n    out.rows = list.map((u) => {\n      const isLit = st.lit === u.ord;\n      return {\n        label: u.label, use: u.use,\n        tenant: u.tenant || 'Available to let',\n        nla: u.nla.toLocaleString('en-GB'),\n        psm: u.let ? String(u.psm) : u.psm + ' ask',\n        rent: u.let ? this.eur(u.rent) : this.eur(u.erv) + ' ERV',\n        share: u.let ? (u.rent / m.rent * 100).toFixed(1) + '%' : '',\n        expiry: u.let ? this.fmtD(u.end) : '\\u2013',\n        brk: u.brk ? this.fmtD(u.brk) : '\\u2013',\n        left: u.let ? u.left.toFixed(1) + 'y' : '\\u2013',\n        enter: () => this.setState({ lit: u.ord }),\n        rowStyle: { background: isLit ? '#FFFFFF' : 'transparent', boxShadow: isLit ? 'inset 0 1px 0 #15181B, inset 0 -1px 0 #15181B' : 'none', transition: 'background 120ms' },\n        pill: {\n          fontSize: '11px', letterSpacing: '0.03em', padding: '2px 8px', display: 'inline-block', whiteSpace: 'nowrap',\n          background: u.let ? PILL_BG[u.use] : 'transparent',\n          color: u.let ? USE_COLOR[u.use] : '#5A6169',\n          boxShadow: u.let ? 'none' : 'inset 0 0 0 1px #C4C7C0'\n        },\n        tenantStyle: this.cell({ textAlign: 'left', fontSize: '14px', fontWeight: u.let ? 500 : 400, fontStyle: u.let ? 'normal' : 'italic', color: u.let ? '#15181B' : '#8B9198' }),\n        rentStyle: this.cell({ color: u.let ? '#15181B' : '#8B9198' }),\n        breakStyle: this.cell({ color: u.brk ? '#A33227' : '#15181B', fontWeight: u.brk ? 500 : 400 })\n      };\n    });\n    const sum = list.reduce((a, u) => ({ n: a.n + u.nla, r: a.r + u.rent, ln: a.ln + (u.let ? u.nla : 0) }), { n: 0, r: 0, ln: 0 });\n    out.rowCount = list.length + ' of ' + m.V.length + ' floors \\u00b7 ' + this.eur(sum.r) + ' p.a.';\n    out.totalNla = sum.n.toLocaleString('en-GB');\n    out.totalPsm = sum.ln ? (sum.r / sum.ln).toFixed(0) : '\\u2013';\n    out.totalRent = this.eur(sum.r);\n    out.totalShare = m.rent ? (sum.r / m.rent * 100).toFixed(0) + '%' : '\\u2013';\n    return out;\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
